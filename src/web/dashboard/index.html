<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vixie — AI Product Demo Generator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, system-ui, sans-serif; background: #0a0a1a; color: #e0e0e0; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    h1 { font-size: 2.5rem; background: linear-gradient(135deg, #00D4FF, #FF6B35); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .subtitle { color: #888; margin-bottom: 40px; font-size: 1.1rem; }
    .card { background: #12122a; border: 1px solid #1e1e3a; border-radius: 16px; padding: 32px; margin-bottom: 24px; }
    .card h2 { font-size: 1.2rem; margin-bottom: 20px; color: #00D4FF; }
    label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 6px; font-weight: 500; }
    input, select { width: 100%; padding: 12px 16px; background: #0a0a1a; border: 1px solid #2a2a4a; border-radius: 10px; color: #fff; font-size: 1rem; margin-bottom: 16px; transition: border-color 0.2s; }
    input:focus, select:focus { outline: none; border-color: #00D4FF; }
    input[type="url"] { font-size: 1.1rem; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    button { width: 100%; padding: 16px; background: linear-gradient(135deg, #00D4FF, #0088CC); color: #fff; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: transform 0.15s, box-shadow 0.2s; }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 212, 255, 0.3); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .status { margin-top: 20px; padding: 16px; background: #0d1b2a; border-radius: 10px; display: none; }
    .status.active { display: block; }
    .status.success { border-left: 4px solid #00ff88; }
    .status.error { border-left: 4px solid #ff4444; }
    .status.running { border-left: 4px solid #FFD700; }
    .progress-bar { width: 100%; height: 4px; background: #1e1e3a; border-radius: 2px; margin-top: 12px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #00D4FF, #FF6B35); border-radius: 2px; transition: width 0.5s ease; }
    .voices-link { color: #00D4FF; cursor: pointer; text-decoration: underline; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Vixie</h1>
    <p class="subtitle">AI-powered product demo video generator</p>

    <div class="card">
      <h2>🌐 Target Website</h2>
      <label for="url">Website URL</label>
      <input type="url" id="url" placeholder="https://your-app.com" required>
    </div>

    <div class="card">
      <h2>🎙️ Voice & Narration</h2>
      <div class="row">
        <div>
          <label for="tts">TTS Provider</label>
          <select id="tts">
            <option value="edge" selected>Edge TTS (Free)</option>
            <option value="openai">OpenAI TTS</option>
            <option value="elevenlabs">ElevenLabs</option>
          </select>
        </div>
        <div>
          <label for="voice">Voice</label>
          <select id="voice">
            <option value="en-US-JennyNeural">Jenny (Female, US)</option>
            <option value="en-US-GuyNeural">Guy (Male, US)</option>
            <option value="en-US-AriaNeural">Aria (Female, US)</option>
            <option value="en-US-DavisNeural">Davis (Male, US)</option>
            <option value="en-GB-SoniaNeural">Sonia (Female, UK)</option>
            <option value="en-IE-RyanNeural">Ryan (Male, Ireland)</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="style">Demo Style</label>
          <select id="style">
            <option value="professional" selected>Professional</option>
            <option value="casual">Casual</option>
            <option value="technical">Technical</option>
          </select>
        </div>
        <div>
          <label for="cursor">Cursor</label>
          <select id="cursor">
            <option value="animated" selected>Animated</option>
            <option value="none">None</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>🎬 Video Settings</h2>
      <div class="row-3">
        <div>
          <label for="resolution">Resolution</label>
          <select id="resolution">
            <option value="720p">720p</option>
            <option value="1080p" selected>1080p</option>
            <option value="4K">4K</option>
          </select>
        </div>
        <div>
          <label for="maxPages">Max Pages</label>
          <input type="number" id="maxPages" value="3" min="1" max="20">
        </div>
        <div>
          <label for="output">Output</label>
          <input type="text" id="output" value="demo.mp4">
        </div>
      </div>
    </div>

    <button id="generate" onclick="startGeneration()">✨ Generate Demo Video</button>

    <div id="status" class="status">
      <div id="status-text"></div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill" style="width: 0%"></div></div>
    </div>
  </div>

  <script>
    let currentJobId = null;
    let pollInterval = null;

    async function startGeneration() {
      const url = document.getElementById('url').value;
      if (!url) { alert('Please enter a URL'); return; }

      const btn = document.getElementById('generate');
      btn.disabled = true;
      btn.textContent = '⏳ Generating...';

      const status = document.getElementById('status');
      status.className = 'status active running';
      document.getElementById('status-text').textContent = 'Starting generation...';
      document.getElementById('progress-fill').style.width = '10%';

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url,
            output: document.getElementById('output').value,
            tts: document.getElementById('tts').value,
            voice: document.getElementById('voice').value,
            style: document.getElementById('style').value,
            cursor: document.getElementById('cursor').value,
            resolution: document.getElementById('resolution').value,
            maxPages: parseInt(document.getElementById('maxPages').value),
          }),
        });

        const data = await res.json();
        currentJobId = data.jobId;

        document.getElementById('status-text').textContent = `Job started: ${currentJobId.slice(0, 8)}...`;
        document.getElementById('progress-fill').style.width = '20%';

        pollInterval = setInterval(pollStatus, 3000);
      } catch (err) {
        status.className = 'status active error';
        document.getElementById('status-text').textContent = `Error: ${err.message}`;
        btn.disabled = false;
        btn.textContent = '✨ Generate Demo Video';
      }
    }

    async function pollStatus() {
      if (!currentJobId) return;

      try {
        const res = await fetch(`/api/status/${currentJobId}`);
        const data = await res.json();

        if (data.status === 'running') {
          document.getElementById('progress-fill').style.width = '50%';
          document.getElementById('status-text').textContent = '🎬 Generating video...';
        } else if (data.status === 'completed') {
          clearInterval(pollInterval);
          document.getElementById('progress-fill').style.width = '100%';
          document.getElementById('status').className = 'status active success';
          document.getElementById('status-text').innerHTML =
            `✅ Video ready! <a href="/api/download/${currentJobId}" style="color:#00D4FF">Download MP4</a>`;
          document.getElementById('generate').disabled = false;
          document.getElementById('generate').textContent = '✨ Generate Demo Video';
        } else if (data.status === 'failed') {
          clearInterval(pollInterval);
          document.getElementById('status').className = 'status active error';
          document.getElementById('status-text').textContent = `❌ Failed: ${data.error}`;
          document.getElementById('generate').disabled = false;
          document.getElementById('generate').textContent = '✨ Generate Demo Video';
        }
      } catch (err) {
        console.error('Poll error:', err);
      }
    }
  </script>
</body>
</html>
